version: '3.8'

services:
  mariadb:
    image: mariadb:11
    container_name: digital-twin-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: digital_twin_factory
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
